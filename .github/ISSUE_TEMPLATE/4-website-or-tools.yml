name: Website, download or tool problem
description: A broken link, a problem with the PDF or EPUB, the KiCad rules file, the release checker, the Agent Skill or the PyPI package.
labels: ["website and tools"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: where
    attributes:
      label: Where
      description: The web address, the file, or the command you ran.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: For example your browser, KiCad version, Python version, or the book's version.
